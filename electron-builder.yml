appId: com.showoff.studio
productName: Showoff
copyright: Copyright © 2026 Showoff
directories:
  buildResources: build
  output: release

files:
  - out/**/*
  - package.json
  - '!**/{.eslintrc,.editorconfig,.prettierrc,tsconfig*.json}'
  - '!**/*.map'
  - '!**/{test,docs,scripts}/**'

# ffmpeg, ffprobe and PGlite's wasm cannot be executed or memory-mapped from
# inside app.asar, so they are unpacked next to it.
asarUnpack:
  - node_modules/ffmpeg-static/**
  - node_modules/ffprobe-static/**
  - node_modules/@electric-sql/pglite/**
  - node_modules/@electric-sql/pglite-pgvector/**

npmRebuild: false

mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  darkModeSupport: true
  # Unsigned for v1. Without the hardened runtime the entitlements below are
  # still honoured by the OS for the TCC prompts.
  hardenedRuntime: false
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSCameraUsageDescription: Showoff records your webcam as a separate track so it can be overlaid on clips.
    NSMicrophoneUsageDescription: Showoff records your voice alongside your screen, and transcribes it locally.
    NSScreenCaptureUsageDescription: Showoff records the screen or window you pick.

dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
  contents:
    - x: 140
      y: 200
    - x: 400
      y: 200
      type: link
      path: /Applications

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

# nsis and portable both produce a .exe, so they need names that differ.
# Sharing one artifactName makes the second target overwrite the first, and
# re-uploading a 100MB asset to GitHub is what timed out the v0.1.0 release.
nsis:
  artifactName: ${productName}-${version}-${arch}-setup.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false

portable:
  artifactName: ${productName}-${version}-${arch}-portable.${ext}

linux:
  target:
    - AppImage
  category: AudioVideo
  maintainer: showoff

publish:
  provider: github
  owner: rondorkerin
  repo: showoff
