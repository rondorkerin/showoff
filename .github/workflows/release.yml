name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

# Building and publishing are deliberately separate jobs.
#
# Letting electron-builder publish from inside the matrix went wrong twice: the
# mac and windows legs each created their own draft for the same tag, so the
# assets ended up split across two releases, and the nsis and portable targets
# raced to upload a 100MB file under one name until GitHub timed out. Building
# to workflow artifacts and cutting the release once, at the end, has neither
# problem.
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac
            name: mac
          - os: windows-latest
            args: --win
            name: win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npx electron-vite build && npx electron-builder ${{ matrix.args }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.name }}
          # The installers, plus the metadata electron-updater reads off the
          # release to notice a new version. Without latest-mac.yml and
          # latest.yml every update check fails quietly. The unpacked app
          # directories are build scratch and would add a gigabyte for nothing.
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Show what will be published
        run: ls -lh dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "Showoff ${GITHUB_REF_NAME}" \
            --generate-notes
